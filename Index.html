<!DOCTYPE html>
<html lang="hr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBB TRIBINA | Fotogalerija</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f17',
                        cardBg: '#151c28',
                        accentBlue: '#2563eb'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-white min-h-screen pb-12 font-sans">

    <!-- Zaglavlje -->
    <header class="border-b border-gray-800 bg-black/40 backdrop-blur sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-extrabold tracking-wider text-blue-500 uppercase flex items-center gap-2">
                <i class="fa-solid font-black fa-shield-halved"></i> BBB TRIBINA
            </h1>
            <span class="text-xs bg-blue-900/50 text-blue-300 px-3 py-1 rounded-full border border-blue-700/50">
                Arhiva
            </span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 pt-6">
        
        <!-- Filteri po stadionima -->
        <div class="mb-8">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                <i class="fa-solid fa-filter text-blue-500"></i> Stadion
            </p>
            <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-none" id="filter-buttons">
                <button onclick="filterMatches('all')" class="filter-btn active bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap shadow-lg shadow-blue-600/30">
                    <i class="fa-solid fa-border-all mr-1"></i> SVI STADIONI
                </button>
                <button onclick="filterMatches('maksimir')" class="filter-btn bg-cardBg text-gray-300 border border-gray-800 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap hover:bg-gray-800">
                    MAKSIMIR
                </button>
                <button onclick="filterMatches('poljud')" class="filter-btn bg-cardBg text-gray-300 border border-gray-800 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap hover:bg-gray-800">
                    <i class="fa-solid fa-location-dot mr-1"></i> POLJUD
                </button>
            </div>
        </div>

        <!-- Mreža kartica / prozorčića -->
        <div id="matches-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Kartice se automatski učitavaju ovdje -->
        </div>

    </main>

    <!-- Modal za Prikaz Galerije -->
    <div id="gallery-modal" class="fixed inset-0 bg-black/95 z-50 hidden flex-col justify-between p-4">
        <div class="flex justify-between items-center text-white z-10">
            <span id="modal-title" class="font-bold text-sm"></span>
            <button onclick="closeGallery()" class="text-gray-400 hover:text-white p-2 text-2xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        
        <div class="flex-1 flex items-center justify-center relative my-4">
            <img id="modal-image" src="" class="max-h-[80vh] max-w-full object-contain rounded-lg shadow-2xl">
        </div>

        <div class="text-center text-xs text-gray-400 py-2">
            Klikni bilo kamo za zatvaranje
        </div>
    </div>

    <script>
        // Podaci o utakmicama i slikama
        const matches = [
            {
                id: 1,
                title: "Dinamo Zagreb vs. Hajduk Split",
                stadium: "maksimir",
                stadiumName: "Stadion Maksimir",
                date: "2026.",
                photosCount: 1,
                coverImg: "slike/file_0000000063f071fd98a039416df8e51d.jpg",
                photos: ["slike/file_0000000088a871fd92cb9b4512ec1f07 (1).jpg"]
            }
        ];

        // Funkcija za prikaz kartica/prozorčića
        function renderMatches(filter = 'all') {
            const grid = document.getElementById('matches-grid');
            grid.innerHTML = '';

            const filtered = filter === 'all' 
                ? matches 
                : matches.filter(m => m.stadium === filter);

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">Nema pronađenih utakmica za ovaj stadion.</div>`;
                return;
            }

            filtered.forEach(match => {
                const card = document.createElement('div');
                card.className = 'bg-cardBg border border-gray-800/80 rounded-2xl overflow-hidden shadow-xl hover:border-blue-500/50 transition duration-300 cursor-pointer group';
                card.onclick = () => openGallery(match.photos[0], match.title);

                card.innerHTML = `
                    <div class="relative h-48 overflow-hidden bg-gray-900">
                        <img src="${match.coverImg}" alt="${match.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        <div class="absolute inset-0 bg-gradient-to-t from-cardBg via-transparent to-transparent"></div>
                        <span class="absolute top-3 right-3 bg-black/60 backdrop-blur text-white text-xs px-2.5 py-1 rounded-lg font-medium border border-white/10">
                            <i class="fa-regular fa-image mr-1"></i> ${match.photosCount}
                        </span>
                    </div>
                    <div class="p-4">
                        <div class="text-xs text-blue-400 font-semibold mb-1 uppercase tracking-wider">${match.stadiumName}</div>
                        <h3 class="font-bold text-base text-white group-hover:text-blue-400 transition mb-2">${match.title}</h3>
                        <div class="text-xs text-gray-400 flex items-center gap-2">
                            <i class="fa-regular fa-calendar"></i> ${match.date}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Funkcija za filtriranje
        function filterMatches(stadium) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white', 'shadow-lg', 'shadow-blue-600/30');
                btn.classList.add('bg-cardBg', 'text-gray-300');
            });

            event.currentTarget.classList.remove('bg-cardBg', 'text-gray-300');
            event.currentTarget.classList.add('bg-blue-600', 'text-white', 'shadow-lg', 'shadow-blue-600/30');

            renderMatches(stadium);
        }

        // Funkcija za otvaranje galerije/slike
        function openGallery(imgSrc, title) {
            document.getElementById('modal-image').src = imgSrc;
            document.getElementById('modal-title').innerText = title;
            document.getElementById('gallery-modal').classList.remove('hidden');
            document.getElementById('gallery-modal').classList.add('flex');
        }

        function closeGallery() {
            document.getElementById('gallery-modal').classList.add('hidden');
            document.getElementById('gallery-modal').classList.remove('flex');
        }

        document.getElementById('gallery-modal').onclick = function(e) {
            if(e.target === this || e.target.id === 'modal-image') {
                closeGallery();
            }
        }

        // Inicijalno učitavanje
        renderMatches();
    </script>
</body>
</html>
